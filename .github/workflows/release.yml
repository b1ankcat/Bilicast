name: Release Dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          tag="$(TZ=Asia/Hong_Kong date +'%Y%m%d')"
          zip_name="bilicast-${tag}.zip"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=${zip_name}" >> "${GITHUB_OUTPUT}"

      - name: Create zip archive
        shell: bash
        run: |
          cd dist
          zip -r "../${{ steps.meta.outputs.zip_name }}" .

      - name: Update date tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin "refs/tags/${{ steps.meta.outputs.tag }}" --force

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --notes "Automated release for ${TAG_NAME}"
            gh release upload "${TAG_NAME}" "${ZIP_NAME}" --clobber
          else
            gh release create "${TAG_NAME}" "${ZIP_NAME}" --title "${TAG_NAME}" --notes "Automated release for ${TAG_NAME}"
          fi
